# Requires the ingress-nginx controller (see docs/ingress-setup.md).
# hello.lab.local isn't real DNS - either add it to /etc/hosts pointing at
# a node IP, or pass Host: hello.lab.local explicitly with curl.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-camel-service
  namespace: hello-camel-service
spec:
  ingressClassName: nginx
  rules:
    - host: hello.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-camel-service
                port:
                  number: 80
