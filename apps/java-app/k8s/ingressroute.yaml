# Traefik-native IngressRoute (instead of a standard Ingress + Middleware).
# No path stripping needed: the app itself serves /sample/api/hello and
# /sample/api/version (its base-path property, see application.yml),
# so the full incoming path is forwarded to the service unchanged.
#
# Shared host across all apps in this lab: api.staging.io - not real DNS,
# either add it to /etc/hosts pointing at a node IP, or pass
# Host: api.staging.io explicitly with curl. Each app gets its own path
# prefix under that one host (this app: /sample) rather than its own
# hostname, so a new app just adds a new route rule here rather than a new
# host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-camel-service
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api.staging.io`) && PathPrefix(`/sample`)
      kind: Rule
      services:
        - name: hello-camel-service
          port: 80
