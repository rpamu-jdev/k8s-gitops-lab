apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-camel-service
  namespace: default
  labels:
    app: hello-camel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-camel-service
  template:
    metadata:
      labels:
        app: hello-camel-service
    spec:
      containers:
        - name: hello-camel-service
          image: 10.137.160.1:3000/rpamu/hello-camel-service:1.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hello-camel-service-config
          # Startup time on this VM grew from ~6s (freshly booted cluster) to
          # 40s+ once Traefik/dashboards/Tekton/Triggers were all sharing
          # the same 4 vCPU/6GB node - the original tight probe windows
          # (liveness killing at ~50s) turned into a crash loop under that
          # load. Generous margins here instead of chasing the exact number.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
