# Demonstrates the env-var-driven config (GREETING_PREFIX, APP_ENVIRONMENT)
# from application.yml. Edit these and re-apply + roll the deployment to
# see them take effect without a rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-camel-service-config
  namespace: default
data:
  GREETING_PREFIX: "Hello"
  APP_ENVIRONMENT: "k8s-lab"
