server:
  port: 8080

app:
  name: hello-camel-service
  version: "@project.version@"
  greeting-prefix: ${GREETING_PREFIX:Hello}
  environment: ${APP_ENVIRONMENT:local}

camel:
  springboot:
    name: hello-camel-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.apache.camel: INFO
