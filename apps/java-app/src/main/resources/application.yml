server:
  port: 8080

app:
  name: hello-camel-service
  version: "@project.version@"
  greeting-prefix: ${GREETING_PREFIX:Hello}
  environment: ${APP_ENVIRONMENT:local}
  # matches this app's Ingress path prefix in the cluster (see
  # apps/java-app/k8s/) - kept in sync with the routing convention rather
  # than stripped at the ingress layer, so the app's own routes are the
  # actual externally-visible paths.
  base-path: ${BASE_PATH:/sample/api}

camel:
  springboot:
    name: hello-camel-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.apache.camel: INFO
