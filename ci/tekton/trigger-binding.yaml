# Extracts the fields the pipeline needs from Gitea's push webhook JSON
# payload (compatible with the standard git-provider push event shape).
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: gitea-push-binding
  namespace: default
spec:
  params:
    - name: git-repo-url
      value: $(body.repository.clone_url)
    - name: short-sha
      value: $(extensions.short_sha)
