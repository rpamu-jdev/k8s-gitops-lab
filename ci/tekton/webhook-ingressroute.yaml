# EventListener auto-creates a Service named el-<eventlistener-name>
# (so: el-gitea-webhook), port 8080. Exposed at its own hostname rather
# than a path under api.staging.test, since it's an operational endpoint
# rather than a backend API.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea-webhook
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`webhook.staging.test`)
      kind: Rule
      services:
        - name: el-gitea-webhook
          port: 8080
