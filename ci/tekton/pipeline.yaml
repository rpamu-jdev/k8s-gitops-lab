# Generic build+push pipeline for any Java app in this repo: clone -> kaniko
# build & push. Deliberately does NOT deploy anything - deployment is
# Argo CD's job (or manual kubectl, for now), not Tekton's. Nothing here is
# specific to any one app: which app, which subdirectory, and what image
# reference to push are all supplied as params by the caller (a manual
# PipelineRun or a Trigger's TriggerTemplate), so the same Pipeline/Tasks
# are reused for every Java app in this repo.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: java-app-build-push
  namespace: default
spec:
  params:
    - name: git-url
      type: string
      description: git repo to clone
    - name: git-revision
      type: string
      description: branch, tag, or ref to build (e.g. a tag name for a release build)
    - name: context-subdir
      type: string
      description: subdirectory within the repo containing the app's Dockerfile (e.g. apps/java-app)
    - name: image
      type: string
      description: full destination image reference, e.g. 10.137.160.1:3000/rpamu/hello-camel-service:1.2.0
    - name: registry
      type: string
      default: "10.137.160.1:3000"
      description: registry host:port needing insecure/plain-HTTP treatment (see kaniko-build Task)
  workspaces:
    - name: source
    - name: maven-cache
      optional: true
      description: persistent ~/.m2 cache (see pvc-maven-cache.yaml) - speeds up repeat Maven builds; omit for a non-Maven app
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: source

    - name: build-and-push
      runAfter: ["fetch-source"]
      taskRef:
        name: kaniko-build
      params:
        - name: context-subdir
          value: $(params.context-subdir)
        - name: image
          value: $(params.image)
        - name: registry
          value: $(params.registry)
      workspaces:
        - name: source
          workspace: source
        - name: maven-cache
          workspace: maven-cache
