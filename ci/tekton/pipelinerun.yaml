# Manual trigger for hello-camel-service specifically (the generic
# Pipeline itself has no app baked in - see pipeline.yaml). Run with
# `kubectl create -f pipelinerun.yaml` (generateName, so re-runnable).
# Build+push only - nothing here deploys anything.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: hello-camel-service-build-
  namespace: default
spec:
  pipelineRef:
    name: java-app-build-push
  params:
    - name: git-url
      value: http://10.137.160.1:3000/rpamu/k8s-gitops-lab.git
    - name: git-revision
      value: main
    - name: context-subdir
      value: apps/java-app
    - name: image
      value: 10.137.160.1:3000/rpamu/hello-camel-service:1.1.0
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: maven-cache
      persistentVolumeClaim:
        claimName: maven-m2-cache
