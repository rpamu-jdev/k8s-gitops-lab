# Listens for Gitea's push webhook, but only fires on TAG pushes (not
# ordinary branch commits) - build+push happens on release, not on every
# commit to main. The pushed tag name becomes the image version.
#
# NOTE: this lab does not verify the webhook's HMAC signature
# (X-Gitea-Signature) - Tekton Triggers has no built-in Gitea signature
# interceptor (only github/gitlab/bitbucket/slack), and implementing HMAC
# verification via a raw CEL expression was judged not worth the
# complexity for a webhook reachable only from the private lab network.
# Filtering is by event type + ref shape only. See docs/tekton-setup.md
# for the trade-off written out.
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: gitea-webhook
  namespace: default
spec:
  serviceAccountName: el-webhook
  triggers:
    - name: gitea-tag-push
      interceptors:
        - ref:
            name: "cel"
          params:
            - name: "filter"
              value: >
                header.match('X-Gitea-Event', 'push') &&
                body.ref.startsWith('refs/tags/')
            - name: "overlays"
              value:
                - key: tag_name
                  expression: "body.ref.split('/')[2]"
      bindings:
        - ref: gitea-tag-push-binding
      template:
        ref: hello-camel-service-tag-trigger-template
