# Builds and pushes the image using Kaniko - same tool and same
# registry-scoped insecure flags used for the earlier manual builds (see
# docs/my-lab/hello-camel-service-deploy.md for why the scoped flags matter
# over the global --insecure/--skip-tls-verify, which broke anonymous
# Docker Hub base-image pulls).
#
# The optional "maven-cache" workspace mounts at /root/.m2 - Kaniko runs a
# Dockerfile's RUN commands directly against the pod's real root
# filesystem (it's not a nested Docker daemon), so a PVC mounted there is
# genuinely visible to `mvn` during the build stage and, unlike the
# "source" workspace, isn't tied to this run's lifecycle - see
# ci/tekton/pvc-maven-cache.yaml and docs/tekton-setup.md. Left optional so
# this Task still works for a non-Maven build with no cache bound.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko-build
  namespace: default
spec:
  params:
    - name: context-subdir
      type: string
      description: subdirectory within the cloned source to use as the build context
    - name: image
      type: string
      description: full destination image reference, e.g. 10.137.160.1:3000/rpamu/hello-camel-service:1.2.0
    - name: registry
      type: string
      default: "10.137.160.1:3000"
  workspaces:
    - name: source
    - name: maven-cache
      optional: true
      mountPath: /root/.m2
  volumes:
    - name: docker-config
      secret:
        secretName: gitea-registry-creds
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:latest
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(workspaces.source.path)/$(params.context-subdir)/Dockerfile
        - --context=dir://$(workspaces.source.path)/$(params.context-subdir)
        - --destination=$(params.image)
        - --insecure-registry=$(params.registry)
        - --skip-tls-verify-registry=$(params.registry)
