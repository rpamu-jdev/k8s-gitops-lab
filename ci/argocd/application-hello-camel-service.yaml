apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-camel-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://10.137.160.1:3000/rpamu/k8s-gitops-manifests.git
    targetRevision: main
    path: apps/hello-camel-service
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
